<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recipe AI</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff5b38">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="topbar">

        <div>
            <div class="logo">🍳</div>
            <h1>Recipe AI</h1>
        </div>

        <button class="language-btn" onclick="toggleLanguage()">
            اردو / EN
        </button>

    </div>

    <p id="headerText">
        Apke ingredients se kya ban sakta hai?
    </p>

</header>


<main>

    <!-- SEARCH -->

    <div class="search-box">

        <span>🔍</span>

        <input
            type="text"
            id="searchRecipe"
            placeholder="Recipe search karein..."
            oninput="searchRecipes()"
        >

    </div>


    <!-- INGREDIENT CARD -->

    <section class="card">

        <h2 id="ingredientTitle">
            🥕 Ingredients Select Karein
        </h2>


        <div class="ingredients">


            <label class="ingredient">
                <input type="checkbox" value="egg">
                <span>🥚</span>
                <b>Egg</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="potato">
                <span>🥔</span>
                <b>Potato</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="onion">
                <span>🧅</span>
                <b>Onion</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="tomato">
                <span>🍅</span>
                <b>Tomato</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="rice">
                <span>🍚</span>
                <b>Rice</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="chicken">
                <span>🍗</span>
                <b>Chicken</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="flour">
                <span>🌾</span>
                <b>Flour</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="milk">
                <span>🥛</span>
                <b>Milk</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="cheese">
                <span>🧀</span>
                <b>Cheese</b>
            </label>


            <label class="ingredient">
                <input type="checkbox" value="bread">
                <span>🍞</span>
                <b>Bread</b>
            </label>


        </div>


        <!-- CUSTOM INGREDIENT -->

        <div class="custom-box">

            <input
                type="text"
                id="customIngredient"
                placeholder="Apni ingredient likhein..."
            >

            <button onclick="addCustomIngredient()">
                Add
            </button>

        </div>


        <div id="customList"></div>


        <!-- MISSING FILTER -->

        <label class="missing-filter">

            <input
                type="checkbox"
                id="onlyAvailable"
            >

            Sirf woh recipes dikhao jisme missing
            ingredients kam hon

        </label>


        <!-- GENERATE -->

        <button
            class="generate-btn"
            onclick="generateRecipes()"
        >
            ✨ Generate Recipes
        </button>

    </section>


    <!-- FAVORITES -->

    <section class="favorite-section">

        <div class="section-title">

            <h2>❤️ Favorites</h2>

            <button onclick="showFavorites()">
                Show
            </button>

        </div>

        <div id="favorites"></div>

    </section>


    <!-- RESULTS -->

    <section id="results"></section>


</main>


<footer>

    <p>
        Recipe AI • Your ingredients, your recipes 🍽️
    </p>

</footer>


<script src="script.js"></script>

<script>
    // PWA service worker register (offline support + APK banane ke liye zaroori)
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker
                .register("service-worker.js")
                .catch((err) => console.error("SW register failed:", err));
        });
    }
</script>

</body>
</html>
